<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(120% 90% at 50% 0%,#16244a 0%,#0c1430 42%,#070b1c 100%);color:#eef1f6;overflow:hidden}
.film{position:relative;height:100vh;padding:26px 40px 104px;display:flex;flex-direction:column}
.pod-bg,.pod-bg-dim{position:absolute;inset:0;display:none;z-index:0}
.pod-bg{width:100%;height:100%;object-fit:cover}
.pod-bg-dim{background:linear-gradient(180deg,rgba(9,14,32,.5) 0%,rgba(9,14,32,.62) 55%,rgba(7,11,22,.84) 100%)}
.podium.has-vid .pod-bg,.podium.has-vid .pod-bg-dim{display:block}
.podium.clean .pod-bg-dim{display:none}   /* while the clip plays alone, nothing (not even the dim) sits on top */
.pod-inner{position:relative;z-index:1}
.hd{display:flex;align-items:center;gap:16px}
.brand{font-size:20px;font-weight:800;letter-spacing:.14em;color:#fff;display:inline-flex;align-items:center;gap:2px;padding-right:16px;border-right:1px solid rgba(255,255,255,.16)}
.brand span{color:#00D7B6}
.hd .kick{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#dbe4f4;display:flex;align-items:center;gap:8px}
.hd .kick svg{height:14px;width:auto;border-radius:2px;display:inline-block}
.hd .sub{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7f8db0;padding-left:14px;border-left:1px solid rgba(255,255,255,.14)}
/* race-result inset top-right: full figures at podium heights + points scorers */
.podium{position:absolute;top:22px;right:38px;width:560px;min-height:262px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:16px 24px 16px;backdrop-filter:blur(4px);z-index:3;overflow:hidden}
.podium .pttl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9fb0c8;margin-bottom:12px;text-align:center}
.pod-figs{display:flex;align-items:flex-end;justify-content:center;gap:24px;margin-bottom:14px}
.pfig{display:flex;flex-direction:column;align-items:center;gap:2px;width:150px}
.pfig img{display:block;width:auto;filter:drop-shadow(0 7px 14px rgba(0,0,0,.55))}
.pfig .pnm{font-size:15px;font-weight:800;text-align:center;line-height:1.05;margin-top:5px;color:var(--sc)}
.pfig .ptm{font-size:11px;font-weight:800;letter-spacing:.02em;text-align:center;line-height:1.1;color:var(--sc);opacity:.92}
.pfig .ppts{font-size:14px;font-weight:800;color:#fff;margin-top:2px}
.pod-list{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;border-top:1px solid rgba(255,255,255,.09);padding-top:12px;margin-top:2px}
.pod-list .ps{font-size:10.5px;font-weight:700;color:#8ea0c0;white-space:nowrap;font-variant-numeric:tabular-nums}
.pod-list .ps u{color:#5f7099;text-decoration:none;margin-right:3px}
.pod-list .ps b{color:var(--pc);font-weight:800;margin-right:4px}
.pod-list .ps i{color:#dbe4f4;font-style:normal}
/* podium panel intro animation */
@keyframes piPop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:none}}
@keyframes piRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes piFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pod-intro{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:230px;text-align:center;gap:6px}
.pi-race{font-size:82px;font-weight:850;letter-spacing:.01em;line-height:1;animation:piPop .55s cubic-bezier(.2,.85,.25,1)}
.pi-name{font-size:30px;font-weight:850;display:flex;gap:9px;align-items:center;justify-content:center;animation:piFade .5s}
.pi-name svg{height:22px;width:auto;border-radius:2px}
.pi-map{max-width:280px;max-height:130px;width:auto;filter:grayscale(1) brightness(1.12);margin-top:4px;animation:piFade .55s .05s backwards}
.pi-sub{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8ea0c0;animation:piFade .6s .1s backwards}
.pfig.pi{animation:piRise .5s backwards}
.pod-list.pi{animation:piFade .5s backwards}
/* standings stage */
.stage{flex:1;position:relative;min-height:0;margin-top:6px}
.row{position:absolute;inset:0}
.d{position:absolute;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  transition:transform .8s cubic-bezier(.4,0,.2,1),opacity .5s;will-change:transform}
.d .pts-row{position:relative;display:inline-flex;margin-bottom:5px}
.d .pts{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;padding:1.5px 6px;border-radius:5px;line-height:1.25;box-shadow:0 2px 7px rgba(0,0,0,.35)}
.d .fig{display:block;width:auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));transition:height .8s cubic-bezier(.4,0,.2,1)}
.d .code{margin-top:6px;font-size:11px;font-weight:800;letter-spacing:.02em;color:var(--dc);white-space:nowrap;line-height:1}
.d .rank{margin-top:3px;font-size:10px;font-weight:700;color:#7f8db0;line-height:1}
.d.zero .pts{color:#5f7099}
.d.zero .code{filter:saturate(.5) brightness(1.15);opacity:.7}
.d.lead .glow{position:absolute;left:50%;bottom:20px;width:64%;height:70%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,var(--dc),transparent 72%);opacity:.32;filter:blur(8px);z-index:-1}
.pt-pop{position:absolute;left:100%;top:0;margin-left:6px;font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none;z-index:6;animation:ptRise 1.5s ease-out both}
@keyframes ptRise{0%{opacity:0;transform:translateY(6px)}18%{opacity:1;transform:translateY(0)}72%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}
.baseline{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);margin:0 40px}
.welcome{position:absolute;top:15%;left:0;right:0;text-align:center;z-index:2;pointer-events:none}
.welcome h2{font-size:60px;font-weight:850;letter-spacing:-.02em;line-height:1.03;margin:0}
.welcome p{font-size:14px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8ea0c0;margin:16px 0 0}
.team-logos{position:absolute;inset:0;pointer-events:none;z-index:2}
.team-asset{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:16px;animation:piFade .6s backwards}
.team-asset .tlogo{height:22px;width:auto;max-width:120px;object-fit:contain;opacity:.96}
.team-asset .tcar{width:112px;height:auto;filter:drop-shadow(0 5px 9px rgba(0,0,0,.5))}
/* controls */
.controls{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;
  background:rgba(10,16,34,.82);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:8px 12px;backdrop-filter:blur(8px);z-index:10}
.controls button{border:0;background:transparent;color:#c7d2e6;cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.controls button:hover{background:rgba(255,255,255,.1);color:#fff}
.controls .play{width:44px;height:44px;background:#fff;color:#0c1430}
.controls .play:hover{background:#fff}
.controls svg{width:16px;height:16px;fill:currentColor}
.controls .ctr{position:relative;cursor:pointer;display:flex;align-items:baseline;gap:6px;padding:4px 10px;border-radius:9px;font-weight:800;font-size:13px;color:#c7d2e6;white-space:nowrap}
.controls .ctr:hover{background:rgba(255,255,255,.08)}
.controls .ctr small{color:#7f8db0;font-weight:700;font-size:11px}
.controls .ctr .who{display:inline-block;overflow:hidden;text-overflow:ellipsis;color:#7f8db0;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.controls .ctr .caret{font-size:9px;color:#5f6f92;transform:translateY(-1px)}
.controls .sep{width:1px;height:20px;background:rgba(255,255,255,.12);margin:0 2px}
.controls #vidtog{position:relative;color:#00D7B6}   /* clip in the reveal: on = teal */
.controls #vidtog.off{color:#6d7a9c}
.controls #vidtog.off::after{content:'';position:absolute;left:7px;right:7px;top:50%;height:2px;border-radius:2px;background:currentColor;transform:rotate(-25deg)}   /* slashed = off */
/* round jump popover */
.jump{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);max-height:min(60vh,420px);overflow:auto;
  background:rgba(10,16,34,.97);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:1px;
  box-shadow:0 16px 40px rgba(0,0,0,.5);z-index:30;min-width:210px}
.jump[hidden]{display:none}
.jump button{border:0;background:transparent;color:#c7d2e6;text-align:left;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:8px;font-family:inherit}
.jump button:hover{background:rgba(255,255,255,.1);color:#fff}
.jump button.on{background:rgba(255,255,255,.09);color:#fff}
.jump button .rn{color:#7f8db0;font-weight:800;font-size:11px;min-width:26px}
.jump button.on .rn{color:#c7d2e6}
.credit{position:fixed;right:20px;bottom:26px;font-size:10px;color:#54648a;z-index:5;text-align:right;line-height:1.4}
.credit b{color:#8ea0c0;font-weight:700}
</style></head>

<script>
const F=window.FILM, DR=F.drivers, R=F.rounds, TOT=F.totalRounds;
const IMGF=s=>(window.FULLB64&&window.FULLB64[s])||('img/figs/'+s+'.png');
const IMGC=s=>(window.FACEB64&&window.FACEB64[s])||('img/cut/'+s+'.png');
const IMGCIRC=r=>(window.CIRCB64&&window.CIRCB64[r])||('img/circuits/'+r+'.png');
const LOGO=t=>(window.LOGOB64&&window.LOGOB64[t])||('img/logos/'+t+'.webp');
const CAR=t=>(window.CARB64&&window.CARB64[t])||('img/cars/'+t+'.png');
const txt=hex=>{const h=(hex||'#888').replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return (0.299*r+0.587*g+0.114*b)>150?'#0b1120':'#fff';};
const ASPECT=0.34, GAP=7, MINCOL=24;
const row=document.getElementById('row'), stage=row.parentElement, pod=document.getElementById('podium');
const podC=document.getElementById('podInner'), podVid=document.getElementById('podVid');
function setBg(on){ if(!pod)return; pod.classList.toggle('has-vid', on);
  if(on && podVid){ podVid.pause(); try{podVid.currentTime=0;}catch(e){} const p=podVid.play(); if(p&&p.catch) p.catch(()=>{}); }   // restart from the top, play once (no loop → holds last frame)
  else if(podVid){ try{podVid.pause();}catch(e){} } }
// build one persistent element per driver (union of all)
const cells={};
Object.keys(DR).forEach(code=>{
  const d=DR[code], el=document.createElement('div'); el.className='d'; el.style.opacity=0; el.style.setProperty('--dc',d.col||'#888');
  el.innerHTML=`<span class="glow"></span><span class="pts-row"><span class="pts" style="background:${d.col||'#888'};color:${txt(d.col)}"></span></span>`
    +`<img class="fig" src="${IMGF(d.slug)}" alt="" style="height:0" onerror="this.dataset.broken='1';this.style.visibility='hidden'">`
    +`<span class="code">${code}</span><span class="rank"></span>`;
  row.appendChild(el); cells[code]=el;
});
let cur=0, card=0, playing=false, composing=false, nextTimer=null;
// reveal with or without the race clip — DEFAULT OFF (no clip); persisted; URL ?video=1 / ?video=0 overrides
let useVideo = localStorage.getItem('f1viz.filmvideo')==='1';
if(/[?&](video=0|novideo)/.test(location.search)) useVideo=false;
if(/[?&]video=1/.test(location.search)) useVideo=true;
// sequence timing (ms): Race X → circuit map → video (plays to its own end) → podium → standings
const RACE_MS=1000, MAP_MS=1900, PODIUM_MS=1300, DWELL=3200, VID_FALLBACK=15000;
function advanceSoon(){ clearTimeout(nextTimer); nextTimer=setTimeout(()=>{ if(!playing)return; if(card>=TOT){stop();return;} show(card+1); }, card===0?600:DWELL); }
let showPointsPop = !/[?&]pop=0/.test(location.search);   // floating "+pts" when drivers move — press "p" or ?pop=0 to disable
function spawnPop(el, pts, col, idx){
  if(!showPointsPop||!el) return;
  const host=el.querySelector('.pts-row'); if(!host) return;
  const p=document.createElement('span'); p.className='pt-pop'; p.textContent='+'+pts;
  p.style.color=col||'#dbe4f4'; p.style.animationDelay=(idx*35)+'ms';
  host.appendChild(p); setTimeout(()=>p.remove(), 1600+idx*35);
}
function setRound(i, dir){
  cur=Math.max(0,Math.min(TOT-1,i)); const rd=R[cur], st=rd.standings, maxPts=st[0].pts;
  document.getElementById('welcome').hidden=true; pod.style.display=''; document.getElementById('teamLogos').innerHTML='';   // leaving the welcome card
  [...row.querySelectorAll('.pt-pop')].forEach(p=>p.remove());
  const gained={}; (rd.scorers||[]).forEach(x=>gained[x.code]=x.pts);   // points won this round, for the floating popups
  document.getElementById('kick').innerHTML=`Race ${rd.round} · ${rd.flag||''} ${rd.gp||rd.short||''}`;   // "Race" to match the reveal; flag may be emoji or inline SVG
  document.getElementById('cnum').textContent=cur+1;
  document.getElementById('cwho').innerHTML='&nbsp;'+(rd.short||'');
  // fit: largest leader height where the whole row fits the width
  const availW=stage.clientWidth-6, availH=Math.max(150, stage.clientHeight-76);   // leave room for the points pill above + code/rank below (and breathing space under the top bar)
  const totalW=mh=>{ let w=0; st.forEach(s=>{ const h=mh*s.pts/maxPts; w+=(s.pts>0?Math.max(ASPECT*h,MINCOL):MINCOL); }); return w+(st.length-1)*GAP; };
  let maxH=availH; for(let k=0;k<6;k++){ const tw=totalW(maxH); if(tw>availW) maxH=maxH*availW/tw; else break; }
  const wOf=s=>{ const h=maxH*s.pts/maxPts; return s.pts>0?Math.max(ASPECT*h,MINCOL):MINCOL; };
  const total=st.reduce((a,s)=>a+wOf(s),0)+(st.length-1)*GAP;
  const applyStandings=(pops)=>{ let x=(availW-total)/2+3; const seen={};
    st.forEach((s,idx)=>{ const el=cells[s.code], h=Math.round(maxH*s.pts/maxPts), w=wOf(s); seen[s.code]=1;
      el.style.opacity=1;
      el.style.transform=`translateX(${(x+w/2).toFixed(1)}px) translateX(-50%)`;
      el.classList.toggle('lead', s.pos===1); el.classList.toggle('zero', s.pts===0);
      const img=el.querySelector('.fig'); img.style.height=h+'px'; img.style.visibility=(!img.dataset.broken&&s.pts>0)?'visible':'hidden';
      const ptsEl=el.querySelector('.pts'); ptsEl.textContent=s.pts>0?s.pts:''; ptsEl.style.display=s.pts>0?'':'none';
      el.querySelector('.rank').textContent=s.pos;
      if(pops && gained[s.code]) spawnPop(el, gained[s.code], (DR[s.code]||{}).col, idx);   // floating "+pts" beside the points
      x+=w+GAP;
    });
    Object.keys(cells).forEach(c=>{ if(!seen[c]) cells[c].style.opacity=0; });   // not yet in the championship
  };
  if(dir==='fwd'){ composing=true; playPodiumIntro(rd, ()=>{ applyStandings(true); composing=false; if(playing) advanceSoon(); }); }  // forward: staged reveal, standings after the podium
  else { clearPodIntro(); composing=false; setBg(useVideo); applyStandings(false); renderPodium(rd, false); }   // backward / resize: direct — static podium (over the clip if enabled), standings now
}
function renderWelcome(){
  clearPodIntro(); composing=false; setBg(false);
  document.getElementById('welcome').hidden=false; pod.style.display='none';
  document.getElementById('kick').innerHTML='2026 Season · The full grid';
  document.getElementById('cnum').textContent='—'; document.getElementById('cwho').innerHTML='&nbsp;Welcome';
  const availW=stage.clientWidth-6, availH=Math.max(150, stage.clientHeight-46);
  const startSet=new Set(R[0].standings.map(s=>s.code));   // season-opening grid only (excludes mid-season subs like TSU)
  const order=Object.keys(DR).filter(c=>startSet.has(c)).sort((a,b)=>{const ta=DR[a].teamName||'',tb=DR[b].teamName||'';return ta<tb?-1:ta>tb?1:((DR[a].fam||'')<(DR[b].fam||'')?-1:1);});
  const n=order.length, GW=7, TW=22;
  let boundaries=0; for(let i=1;i<n;i++) if(DR[order[i]].team!==DR[order[i-1]].team) boundaries++;
  const gaps=(n-1-boundaries)*GW + boundaries*TW;
  const H=Math.min(availH, (availW-gaps)/(n*ASPECT)), fw=ASPECT*H;
  let x=(availW-(n*fw+gaps))/2+3, prevTeam=null; const seen={}, teamX={};
  order.forEach(code=>{ const el=cells[code], d=DR[code]; seen[code]=1;
    if(prevTeam!==null) x += (d.team!==prevTeam?TW:GW); prevTeam=d.team;
    el.style.opacity=1; el.classList.remove('lead','zero');
    el.style.transform=`translateX(${(x+fw/2).toFixed(1)}px) translateX(-50%)`;
    const img=el.querySelector('.fig'); img.style.height=Math.round(H)+'px'; img.style.visibility=img.dataset.broken?'hidden':'visible';
    el.querySelector('.pts').style.display='none';
    el.querySelector('.code').textContent=code; el.querySelector('.rank').textContent='';
    if(!teamX[d.team]) teamX[d.team]={L:x,R:x+fw}; else teamX[d.team].R=x+fw;
    x+=fw;
  });
  Object.keys(cells).forEach(c=>{ if(!seen[c]) cells[c].style.opacity=0; });
  // above each team's pair: the car, and above the car the team logo
  const logos=document.getElementById('teamLogos'); logos.innerHTML='';
  Object.keys(teamX).forEach((t,i)=>{ const {L,R}=teamX[t], cx=(L+R)/2;
    const a=document.createElement('div'); a.className='team-asset'; a.style.left=cx.toFixed(1)+'px'; a.style.bottom=(H+34)+'px'; a.style.animationDelay=(i*45)+'ms';
    a.innerHTML=`<img class="tcar" src="${CAR(t)}" onerror="this.style.display='none'"><img class="tlogo" src="${LOGO(t)}" onerror="this.style.display='none'">`;
    logos.appendChild(a);
  });
}
// staged reveal: RACE X (big) → circuit map (a bit longer) → the race clip plays CLEAN to its own end
// (nothing on top) → podium animation → standings move.
let podTimers=[], vidWait=null, vidFb=null;
function clearVidWait(){ if(vidWait){ podVid.removeEventListener('ended', vidWait); vidWait=null; } if(vidFb){ clearTimeout(vidFb); vidFb=null; } }
function clearPodIntro(){ podTimers.forEach(clearTimeout); podTimers=[]; clearVidWait(); pod.classList.remove('clean'); }
function playPodiumIntro(rd, onStandings){
  clearPodIntro();
  setBg(false);   // no clip yet — the Race X / map intro sits on the plain panel
  // Stage A — Race X (big)
  podC.innerHTML=`<div class="pod-intro"><div class="pi-race">Race ${rd.round}</div></div>`;
  // Stage B — circuit name + map + circuit (held a bit longer)
  podTimers.push(setTimeout(()=>{
    podC.innerHTML=`<div class="pod-intro"><div class="pi-name">${rd.flag||''} ${rd.short||''}</div>`
      +`<img class="pi-map" src="${IMGCIRC(rd.round)}" onerror="this.style.display='none'">`
      +`<div class="pi-sub">${rd.circuit||''}</div></div>`;
  }, RACE_MS));
  // Stage C — WITH clip: clear the panel (nothing on top) and let it play to its END, then podium.
  //           WITHOUT clip: go straight from the map to the podium.
  const toPodium=()=>{ clearVidWait(); pod.classList.remove('clean');
    renderPodium(rd, true);                                                   // Stage D — podium animation
    podTimers.push(setTimeout(()=>{ onStandings&&onStandings(); }, PODIUM_MS)); // Stage E — standings move
  };
  podTimers.push(setTimeout(()=>{
    if(!useVideo){ toPodium(); return; }
    podC.innerHTML='';        // nothing over the video
    pod.classList.add('clean'); setBg(true);   // start the clip from 0 (no loop → ends on its last frame), no dim
    vidWait=()=>toPodium();
    podVid.addEventListener('ended', vidWait, {once:true});
    const dur=(podVid.duration && isFinite(podVid.duration) && podVid.duration>1) ? podVid.duration*1000+300 : VID_FALLBACK;
    vidFb=setTimeout(toPodium, dur);   // safety net if 'ended' never fires (missing clip / blocked autoplay)
  }, RACE_MS+MAP_MS));
}
function renderPodium(rd, compose){
  const by=p=>rd.podium.find(x=>x.pos===p), order=[by(2),by(1),by(3)], figH=[132,170,110];
  const figs=order.map((p,i)=>{ if(!p)return''; const d=DR[p.code]||{};
    const dly=compose?`;animation-delay:${(p.pos-1)*160}ms`:'';
    return `<div class="pfig${compose?' pi':''}" style="--sc:${d.col||'#888'}${dly}">
      <img src="${IMGF(d.slug)}" style="height:${figH[i]}px" onerror="this.style.visibility='hidden'">
      <div class="pnm">${d.fam||p.code}</div>
      <div class="ptm">${p.teamName||''}</div>
      <div class="ppts">+${p.pts} pts</div></div>`;}).join('');
  const rest=(rd.scorers||[]).slice(3);
  const list=rest.map(s=>{ const d=DR[s.code]||{};
    return `<span class="ps" style="--pc:${d.col||'#888'}"><u>${s.pos}</u><b>${s.code}</b><i>+${s.pts}</i></span>`;}).join('');
  podC.innerHTML=`<div class="pod-figs">${figs}</div>`
    +(list?`<div class="pod-list${compose?' pi':''}"${compose?' style="animation-delay:540ms"':''}>${list}</div>`:'');
}
// controls — card 0 = welcome, 1..TOT = rounds
const playIc='<path d="M7 5v14l12-7z"/>', pauseIc='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
function show(c){ c=Math.max(0,Math.min(TOT,c)); const back=c<card; card=c; if(card===0) renderWelcome(); else setRound(card-1, back?'back':'fwd'); syncHash(); }   // forward = full reveal, backward = direct
// URL state: #<round> (or #0 = welcome) so a reload / shared link returns to the same card
function syncHash(){ try{ history.replaceState(null,'','#'+card); }catch(e){} }
function applyHash(){ const n=parseInt((location.hash||'').replace('#',''),10);
  card=(isNaN(n)||n<=0)?0:Math.min(TOT,n);
  if(card===0) renderWelcome(); else setRound(card-1,'instant');   // direct restore — don't replay the intro/clip
}
addEventListener('hashchange', ()=>{ stop(); applyHash(); });
function stop(){ playing=false; clearTimeout(nextTimer); nextTimer=null; document.getElementById('playIcon').innerHTML=playIc; }
function play(){ if(playing){ stop(); return; } playing=true; document.getElementById('playIcon').innerHTML=pauseIc;
  if(card>=TOT) show(0);                 // wrap back to the welcome card
  if(!composing) advanceSoon();          // if a round's sequence is already running, its finish will chain the next
}
document.getElementById('play').onclick=play;
document.getElementById('next').onclick=()=>{stop();show(card+1);};
document.getElementById('prev').onclick=()=>{stop();show(card-1);};
document.getElementById('restart').onclick=()=>{stop();show(0);};
document.getElementById('fs').onclick=()=>{ if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen&&document.exitFullscreen(); };
// race-clip toggle: two reveal modes — with the clip, or straight to the podium
const vidtog=document.getElementById('vidtog');
function syncVidTog(){ vidtog.classList.toggle('off', !useVideo); vidtog.title = useVideo ? 'Race clip: on — click to skip it' : 'Race clip: off — click to show it'; }
vidtog.onclick=()=>{ useVideo=!useVideo; localStorage.setItem('f1viz.filmvideo', useVideo?'1':'0'); syncVidTog();
  if(!useVideo){ if(vidWait) vidWait(); setBg(false); }   // turning off mid-clip → jump to the podium now and drop the video
};
syncVidTog();
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){stop();show(card+1);} else if(e.key==='ArrowLeft'){stop();show(card-1);} else if(e.key===' '){e.preventDefault();play();} else if(e.key==='p'||e.key==='P'){ showPointsPop=!showPointsPop; } });
let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{ card===0?renderWelcome():setRound(cur,'instant'); },120);});
document.getElementById('ctot').textContent=TOT;

// ---- fixed-width name slot: reserve the width of the LONGEST round name so the bar never shifts ----
(function fixWho(){
  const who=document.getElementById('cwho'); const cs=getComputedStyle(who);
  const probe=document.createElement('span');
  probe.style.cssText=`position:absolute;visibility:hidden;white-space:nowrap;font:${cs.fontWeight} ${cs.fontSize}/1 ${cs.fontFamily};letter-spacing:${cs.letterSpacing};text-transform:${cs.textTransform}`;
  document.body.appendChild(probe);
  let max=0; ['Welcome',...R.map(r=>r.short||'')].forEach(n=>{ probe.textContent=' '+n; max=Math.max(max,probe.offsetWidth); });
  probe.remove(); who.style.width=Math.ceil(max+2)+'px';
})();

// ---- round jump popover: click the counter to jump to any round (or the welcome card) ----
(function jump(){
  const ctr=document.getElementById('ctr'); const pop=document.createElement('div'); pop.className='jump'; pop.hidden=true;
  pop.innerHTML=`<button data-c="0"><span class="rn">—</span>Welcome</button>`+
    R.map((r,i)=>`<button data-c="${i+1}"><span class="rn">R${r.round}</span>${r.flag||''}&nbsp;${r.short||''}</button>`).join('');
  ctr.appendChild(pop);
  const markOn=()=>[...pop.children].forEach(b=>b.classList.toggle('on',+b.dataset.c===card));
  ctr.addEventListener('click',e=>{ e.stopPropagation(); if(pop.hidden){markOn(); pop.hidden=false; const on=pop.querySelector('.on'); if(on)on.scrollIntoView({block:'nearest'});} else pop.hidden=true; });
  pop.addEventListener('click',e=>{ const b=e.target.closest('button[data-c]'); if(!b)return; e.stopPropagation(); stop(); show(+b.dataset.c); pop.hidden=true; });
  addEventListener('click',()=>{ pop.hidden=true; });
  addEventListener('keydown',e=>{ if(e.key==='Escape')pop.hidden=true; });
})();

applyHash();   // restore the card from the URL (or the welcome card if none)
</script>
</body></html>
